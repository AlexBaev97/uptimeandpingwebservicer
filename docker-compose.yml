services:
  db:
    image: postgres:16-alpine
    container_name: uptime-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-uptime}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-uptime}
      POSTGRES_DB: ${POSTGRES_DB:-uptime}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12

  backend:
    build: ./backend
    container_name: uptime-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: ${POSTGRES_USER:-uptime}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-uptime}
      DB_NAME: ${POSTGRES_DB:-uptime}
      PORT: 3001
      SCHEDULER_TICK_MS: ${SCHEDULER_TICK_MS:-5000}
      CHECK_TIMEOUT_MS: ${CHECK_TIMEOUT_MS:-10000}

  frontend:
    build: ./frontend
    container_name: uptime-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${WEB_PORT:-8080}:80"

volumes:
  db_data:
